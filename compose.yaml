# Oracle ARM / Linux. Host networking keeps the application on loopback only.
services:
  app:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      BINGO_HOST: 127.0.0.1
      BINGO_PORT: 8000
      BINGO_PUBLIC_URL: https://${BINGO_DOMAIN:?Set BINGO_DOMAIN in .env}
    volumes:
      - bingo_data:/app/data
      - bingo_backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      BINGO_DOMAIN: ${BINGO_DOMAIN:?Set BINGO_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  bingo_data:
  bingo_backups:
  caddy_data:
  caddy_config:
