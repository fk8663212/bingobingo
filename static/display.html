<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10110f"><title>晚宴賓果 · 現場開獎</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/draw-animation.css"><script defer src="/vendor/qrcode.js"></script><script type="module" src="/app.js"></script></head>
<body data-page="display" class="display-body">
  <header class="topbar"><a class="brand" href="/"><span class="brand-mark">✦</span><span>晚宴賓果<small>THE LUCKY EVENING</small></span></a><div class="header-actions"><span id="display-game" class="pill">第 1 局</span><span class="connection" id="connection" role="status">連線中</span><button id="fullscreen" class="button small subtle">全螢幕 ⛶</button></div></header>
  <main class="display-shell"><div id="demo-banner" class="notice" hidden>本機示範活動</div><div class="display-grid">
    <section class="display-draw"><p class="eyebrow">THE LUCKY NUMBER</p><h1>今晚的幸運號碼</h1><div id="draw-stage" class="draw-stage draw-stage-display" role="img" aria-label="等待開獎"><span class="draw-orbit" aria-hidden="true"></span><span class="draw-orbit draw-orbit-inner" aria-hidden="true"></span><div class="projection-number draw-value" id="display-latest" aria-hidden="true">✦</div><span class="draw-spark draw-spark-one" aria-hidden="true">✦</span><span class="draw-spark draw-spark-two" aria-hidden="true">✧</span></div><p id="display-round" class="display-caption">與你同席的好運，即將登場。</p><div class="display-counts"><span><strong id="display-players">0</strong> 位來賓</span><span><strong id="display-drawn">0</strong> 個號碼已開出</span></div></section>
    <section class="display-winners"><div class="section-heading between"><h2>幸運得主 <span class="gold-text">✧</span></h2><span id="display-winner-count" class="pill">0 / 10</span></div><p class="muted">一條連線，一份今晚的驚喜。</p><div id="display-winners" class="winner-list"></div><div class="join-block"><div id="join-qr" class="join-qr" aria-label="玩家入口 QR 碼"></div><div><h3>你的好運，準備好了嗎？</h3><p class="muted">掃碼開啟玩家頁<br>輸入座位上的專屬領卡碼</p></div></div></section>
  </div><section class="projection-history"><div class="section-heading between"><h2>已開號碼</h2><span class="muted">依開獎順序排列 →</span></div><div id="draw-history" class="ball-history"></div></section><div id="page-error" class="error-banner" role="alert" hidden></div></main><div id="toast" class="toast" role="status" hidden></div>
  <span id="draw-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
</body>
</html>
